<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Eco Solitario · Alter Motion Lock v0.9.8</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.045),transparent 34%),linear-gradient(#151923 0 72%,#11141b 72% 100%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(#737985 0 4px,#292d36 4px 100%);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
#ground:after{content:"";position:absolute;left:0;right:0;top:18px;height:1px;background:#3d424e}
#player{position:absolute;left:0;top:0;width:96px;height:128px;image-rendering:pixelated;image-rendering:crisp-edges;transform-origin:50% 100%;filter:drop-shadow(0 8px 5px #0009);will-change:transform;backface-visibility:hidden;contain:strict}
#shadow{position:absolute;left:0;top:0;width:52px;height:10px;border-radius:50%;background:#0009;filter:blur(2px);will-change:transform}
#hud{position:absolute;z-index:20;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 12px;background:#07090dcc;border:1px solid #444b59;border-radius:9px;font-size:12px;line-height:1.55}
#hud b{font-size:14px} #state{color:#68e0e5} #speed{color:#ffd57a} #frame{color:#b9ff9d}
#reset{margin-top:7px;border:1px solid #555b68;background:#151922;color:#fff;padding:6px 9px;border-radius:6px}
#joy{position:absolute;z-index:20;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;border:2px solid #69707f;background:#07090db5}
#stick{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#c8ccd6aa;will-change:transform}
.btn{position:absolute;z-index:20;border-radius:50%;border:2px solid #69707f;background:#07090dd8;color:#fff;font-weight:700;display:grid;place-items:center;touch-action:none}
#jump{right:max(20px,env(safe-area-inset-right));bottom:118px;width:82px;height:82px}
#shoot{right:116px;bottom:max(18px,env(safe-area-inset-bottom));width:72px;height:72px}
#bat{right:max(20px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:72px;height:72px}
#damage{right:204px;bottom:max(24px,env(safe-area-inset-bottom));width:58px;height:58px;font-size:11px}
#caption{position:absolute;z-index:20;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font-size:11px;color:#8c93a3;text-align:right}
@media(max-width:700px) and (orientation:portrait){#caption{display:none}#hud{font-size:11px}#damage{right:190px}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud"><b>ALTER MOTION LOCK</b><br>STATO <span id="state">IDLE</span><br>VELOCITÀ <span id="speed">0</span><br>FRAME <span id="frame">0</span><br><button id="reset">RESET</button></div>
  <div id="caption">Eco Solitario v0.9.8<br>solo Alter · motion first</div>
  <div id="shadow"></div>
  <canvas id="player" width="96" height="128"></canvas>
  <div id="ground"></div>
  <div id="joy"><div id="stick"></div></div>
  <button class="btn" id="jump">SALTO</button>
  <button class="btn" id="shoot">SPARO</button>
  <button class="btn" id="bat">MAZZA</button>
  <button class="btn" id="damage">DANNO</button>
</div>
<script src="game.js?v=098"></script>
</body>
</html>
