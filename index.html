<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.json"><title>Eco Solitario v0.9 — Alter Alive</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;font-family:"Courier New",monospace;color:#f1dfb9}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#080b10;align-items:center;justify-content:center;text-align:center;font-size:20px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#16142a}
.layer{position:absolute;inset:-3%;background-repeat:repeat-x;background-position:center bottom;will-change:transform}
#far{background-image:url('layer_far.png');background-size:auto 106%;filter:saturate(1.12) brightness(.9)}
#mid{background-image:url('layer_mid.png');background-size:auto 106%}
#fore{background-image:url('layer_fore.png');background-size:auto 106%;z-index:18;pointer-events:none}
.haze{position:absolute;inset:0;background:radial-gradient(circle at 74% 39%,rgba(255,133,55,.15),transparent 26%),linear-gradient(transparent 48%,rgba(7,8,13,.42));pointer-events:none}
.platform{position:absolute;z-index:7;height:28px;background:linear-gradient(#6e5942 0 5px,#2b2929 5px 100%);border-top:3px solid #9b7950;box-shadow:0 7px 12px #0008}
.platform:after{content:"";position:absolute;left:0;right:0;top:-10px;height:12px;background:repeating-linear-gradient(110deg,#315a36 0 5px,transparent 5px 16px)}
#p1{left:-5%;bottom:17%;width:66%}#p2{left:69%;bottom:24%;width:38%}#p3{left:48%;bottom:39%;width:18%}
.crate{position:absolute;z-index:8;width:48px;height:43px;background:#68472d;border:5px solid #32251d;box-shadow:inset 0 0 0 2px #9a7147}
#player{position:absolute;z-index:12;left:20%;bottom:19.5%;width:160px;height:190px;background-image:url('alter_alive_sheet.png');background-size:1920px 190px;background-repeat:no-repeat;image-rendering:pixelated;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px #000a)}
#player.idle{animation:idle .9s steps(2) infinite}#player.run{animation:run .48s steps(6) infinite}
@keyframes idle{from{background-position:0 0}to{background-position:-320px 0}}@keyframes run{from{background-position:-320px 0}to{background-position:-1280px 0}}
#hud{position:absolute;z-index:30;left:2%;top:3%;padding:9px 13px;background:#05080eea;border:2px solid #725947;min-width:260px}.title{font-size:20px;font-weight:bold;letter-spacing:2px}.red{color:#e65347}.cyan{color:#52d9df}
#obj{position:absolute;z-index:30;right:3%;top:3%;padding:10px 15px;background:#05080eea;border-left:3px solid #dc974e;min-width:290px}
#radioBox{position:absolute;z-index:31;right:3%;top:18%;width:355px;padding:11px;background:#03080ef0;border:1px solid #2794a3;display:none}.wave{height:14px;margin-top:7px;background:repeating-linear-gradient(90deg,#43dbe2 0 2px,transparent 2px 7px)}
#joy{position:absolute;z-index:40;left:3%;bottom:4%;width:122px;height:122px;border:3px solid #8888;border-radius:50%;background:#070b11aa}.stick{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#bbb9}
.btn{position:absolute;z-index:40;border-radius:50%;background:#070b11d8;border:3px solid #8888;color:white;font-weight:bold;display:grid;place-items:center;touch-action:none}
#jump{right:4%;bottom:19%;width:84px;height:84px}#radio{right:14%;bottom:20%;width:66px;height:66px}#shoot{right:12%;bottom:5%;width:78px;height:78px}#hit{right:3%;bottom:4%;width:76px;height:76px}
#tag{position:absolute;z-index:30;left:2%;bottom:1.8%;font-size:11px;letter-spacing:1px;color:#ddd}#ver{color:#53d8df}
@media(orientation:portrait){#rotate{display:flex}#game{display:none}}</style></head><body>
<div id="rotate">📻 RUOTA L’iPHONE<br><br><small>STAY ON THE AIR.</small></div><div id="game">
<div id="far" class="layer"></div><div id="mid" class="layer"></div><div class="haze"></div>
<div id="p1" class="platform"></div><div id="p2" class="platform"></div><div id="p3" class="platform"></div>
<div class="crate" style="left:42%;bottom:20%"></div><div class="crate" style="left:76%;bottom:27%"></div>
<div id="player" class="idle"></div><div id="fore" class="layer"></div>
<div id="hud"><div class="title">ECO SOLITARIO</div>VITA <span class="red">♥♥♥♥♥</span> &nbsp; MUNIZIONI <span id="ammo">12/12</span></div>
<div id="obj"><span class="red">OBIETTIVO:</span><br>SEGUI LA FREQUENZA <span class="cyan">47.3 FM</span></div>
<div id="radioBox"><b class="cyan">47.3 FM — RADIO ECO</b><br><br><span id="line">Segnali deboli...</span><div class="wave"></div></div>
<div id="joy"><div class="stick" id="stick"></div></div><button id="radio" class="btn">📻</button><button id="jump" class="btn">SALTO</button><button id="shoot" class="btn">SPARO</button><button id="hit" class="btn">MAZZA</button>
<div id="tag">CITTÀ SENZA NOME &nbsp;|&nbsp; GIORNO ??? &nbsp;|&nbsp; STAY ON THE AIR &nbsp; <span id="ver">v0.9 ALTER ALIVE</span></div></div>
<script>
const P=document.querySelector('#player'),F=document.querySelector('#far'),M=document.querySelector('#mid'),R=document.querySelector('#fore'),J=document.querySelector('#joy'),S=document.querySelector('#stick');
let dir=0,world=0,x=20,ammo=12,busy=false,ro=false,li=0;
function loop(){if(dir&&!busy){world+=dir*1.1;x=Math.max(12,Math.min(52,x+dir*.09));P.className='run'}else if(!busy)P.className='idle';P.style.left=x+'%';P.style.scale=dir<0?'-1 1':'1 1';F.style.transform=`translateX(${-world*.10}px)`;M.style.transform=`translateX(${-world*.32}px)`;R.style.transform=`translateX(${-world*.72}px)`;requestAnimationFrame(loop)}loop();
function move(e){let r=J.getBoundingClientRect(),t=e.touches[0],dx=Math.max(-40,Math.min(40,t.clientX-r.left-r.width/2));S.style.transform=`translateX(${dx}px)`;dir=Math.abs(dx)>9?Math.sign(dx):0}
J.addEventListener('touchstart',e=>{e.preventDefault();move(e)},{passive:false});J.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});J.addEventListener('touchend',()=>{dir=0;S.style.transform='translateX(0)'});
function state(cell,dur,anim){busy=true;P.style.animation='none';P.style.backgroundPosition=(-160*cell)+'px 0';if(anim)anim();setTimeout(()=>{P.style.animation='';busy=false},dur)}
document.querySelector('#jump').ontouchstart=()=>state(8,650,()=>P.animate([{bottom:'19.5%'},{bottom:'45%'},{bottom:'19.5%'}],{duration:650,easing:'cubic-bezier(.2,.7,.25,1)'}));
document.querySelector('#shoot').ontouchstart=()=>{if(ammo){ammo--;document.querySelector('#ammo').textContent=ammo+'/12';state(9,220,()=>P.animate([{filter:'brightness(2)'},{filter:'brightness(1)'}],{duration:120}))}};
document.querySelector('#hit').ontouchstart=()=>state(10,330,()=>P.animate([{rotate:'0deg'},{rotate:'-10deg'},{rotate:'0deg'}],{duration:300}));
let lines=["Segnali deboli... ma sei ancora lì?","Finché ascolti, non sei solo.","Qualcuno trasmette ancora.","Alter... resta sulla frequenza."];
document.querySelector('#radio').ontouchstart=()=>{ro=!ro;document.querySelector('#radioBox').style.display=ro?'block':'none';if(ro)document.querySelector('#line').textContent=lines[li++%lines.length]};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
