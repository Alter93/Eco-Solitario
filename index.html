<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Eco Solitario v0.4</title><style>*{box-sizing:border-box;touch-action:none;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#080910;font-family:monospace}canvas{width:100vw;height:100vh;display:block;image-rendering:pixelated}.joy{position:fixed;left:22px;bottom:22px;width:126px;height:126px;border:2px solid #ffffff55;border-radius:50%;background:#0007}.stick{position:absolute;left:40px;top:40px;width:46px;height:46px;border-radius:50%;background:#ffffff66}.actions{position:fixed;right:18px;bottom:18px;width:210px;height:158px}.b{position:absolute;border-radius:50%;border:2px solid #ffffff55;background:#0a0d14dd;color:white;font:bold 11px monospace}.j{right:3px;top:0;width:68px;height:68px}.s{right:78px;top:76px;width:62px;height:62px}.m{right:3px;top:88px;width:62px;height:62px}.r{right:148px;top:12px;width:55px;height:55px}</style></head><body><canvas id="c"></canvas><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button class="b r" data-a="r">📻</button><button class="b j" data-a="j">SALTO</button><button class="b s" data-a="s">SPARO</button><button class="b m" data-a="m">MAZZA</button></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),last=0,t=0,cam=0,mv=0,dlg=-1,bul=[],dust=[];function rs(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}onresize=rs;rs();const G=()=>H*.72,P={x:140,y:0,vy:0,d:1,on:1,hp:5,ammo:12,shot:0},world=5000;let foes=[900,1650,2450,3400,4200].map((x,i)=>({x,hp:2,live:1,d:i%2?1:-1}));const lines=[['JACK','...C’è qualcuno? Se mi senti, rispondi.'],['DEXTER','Jack, magari vuole spararci.'],['JACK','Questa è Radio Eco. Non sei solo.'],['ALTER','Non so se questa cosa mi rassicura.'],['DEXTER','Ottimo. Ha senso dell’umorismo. Tienilo vivo.']];function rect(a,b,w,h,col){g.fillStyle=col;g.fillRect(Math.round(a),Math.round(b),w,h)}function act(a){if(a==='j'&&P.on&&dlg<0){P.vy=-570;P.on=0}if(a==='s'&&P.ammo&&P.shot<=0&&dlg<0){P.ammo--;P.shot=.25;bul.push({x:P.x+P.d*25,y:P.y+24,v:P.d*760,q:1})}if(a==='m'&&dlg<0)foes.forEach(f=>{if(f.live&&Math.abs(f.x-P.x)<65){f.hp-=2;if(f.hp<=0)f.live=0}});if(a==='r'){dlg=dlg<0?0:dlg+1;if(dlg>=lines.length)dlg=-1}}document.querySelectorAll('.b').forEach(b=>b.onpointerdown=e=>{e.preventDefault();act(b.dataset.a)});c.onpointerdown=()=>{if(dlg>=0){dlg++;if(dlg>=lines.length)dlg=-1}};let J=document.querySelector('#joy'),S=document.querySelector('#stick'),id=null;function jm(e){let r=J.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);S.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`;mv=Math.abs(dx)>10?Math.sign(dx):0}J.onpointerdown=e=>{id=e.pointerId;J.setPointerCapture(id);jm(e)};J.onpointermove=e=>{if(e.pointerId===id)jm(e)};J.onpointerup=J.onpointercancel=()=>{id=null;mv=0;S.style.transform='translate(0,0)'};
function sky(){let q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#171635');q.addColorStop(.52,'#9a4d51');q.addColorStop(1,'#171921');g.fillStyle=q;g.fillRect(0,0,W,H);g.fillStyle='#f5a35b';g.beginPath();g.arc(W*.77,H*.27,34,0,7);g.fill();for(let l=0;l<3;l++){g.fillStyle=['#292844','#24243b','#1e2232'][l];for(let i=0;i<18;i++){let xx=i*145-(cam*(.08+l*.08)%145),hh=70+(i*47+l*31)%170;g.fillRect(xx,G()-hh,75+l*10,hh)}}}

function hero(){let run=Math.abs(mv)>0&&P.on,ph=t*11,bob=run?Math.sin(ph)*2:Math.sin(t*2.3)*1.4,br=run?0:Math.sin(t*2.3)*1.2,leg=run?Math.sin(ph)*7:0;g.save();g.translate(P.x,P.y+bob);if(P.d<0)g.scale(-1,1);rect(-8,13,8,29,'#4d5a4b');rect(6,-13,15,15,'#d0aa88');rect(2,-18,20,7,'#c8ad70');rect(20,-15,9,5,'#c8ad70');rect(28+Math.sin(t*5)*2,-13,9,4,'#c8ad70');rect(0,2,24,28+br,'#922f3a');rect(4,4,16,18+br,'#b23b43');rect(2,30,9,13,'#cfb487');rect(14,30,9,13,'#cfb487');rect(3,42+leg,7,9,'#d0aa88');rect(0,50+leg,12,5,'#eee');rect(16,42-leg,7,9,'#d0aa88');rect(14,50-leg,13,5,'#eee');rect(22,18,18,5,'#25282c');g.restore()}

let intro=0;function up(dt){if(dlg>=0)return;P.shot=Math.max(0,P.shot-dt);P.x+=mv*245*dt;if(mv){P.d=mv;if(P.on&&Math.random()<dt*9)dust.push({x:P.x,y:G()-4,q:.35})}P.vy+=1350*dt;P.y+=P.vy*dt;if(P.y+54>=G()){P.y=G()-54;P.vy=0;P.on=1}else P.on=0;bul.forEach(b=>{b.x+=b.v*dt;b.q-=dt;foes.forEach(f=>{if(f.live&&Math.abs(b.x-f.x)<22){f.hp--;b.q=0;if(f.hp<=0)f.live=0}})});bul=bul.filter(b=>b.q>0);dust.forEach(d=>{d.y-=12*dt;d.q-=dt});dust=dust.filter(d=>d.q>0);if(P.x>500&&!intro){intro=1;dlg=0}cam+=(P.x-W*.38-cam)*Math.min(1,dt*5);cam=Math.max(0,Math.min(world-W,cam))}
function loop(ms){let dt=Math.min(.032,(ms-last)/1000||0);last=ms;t=ms/1000;up(dt);sky();g.save();g.translate(-cam,0);scene();hero();g.restore();hud();requestAnimationFrame(loop)}P.y=G()-54;requestAnimationFrame(loop);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
