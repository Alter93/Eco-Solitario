<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b10"><link rel="manifest" href="manifest.json">
<title>Eco Solitario v0.9.2 — True Animation</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;font-family:"Courier New",monospace;color:#f1dfb9}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#080b10;align-items:center;justify-content:center;text-align:center;font-size:20px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#16142a}
.layer{position:absolute;inset:0;background-repeat:repeat-x;background-position:center bottom;will-change:background-position}
#far{background-image:url('layer_far.png');background-size:auto 100%;filter:saturate(1.15) brightness(.93)}
#mid{background-image:url('layer_mid.png');background-size:auto 100%}
#fore{background-image:url('layer_fore.png');background-size:auto 100%;z-index:18;pointer-events:none}
.haze{position:absolute;inset:0;background:radial-gradient(circle at 74% 39%,rgba(255,133,55,.15),transparent 26%),linear-gradient(transparent 48%,rgba(7,8,13,.38));pointer-events:none}

.platform{position:absolute;z-index:7;height:30px;background:linear-gradient(#69543f 0 5px,#272728 5px 100%);border-top:3px solid #96734d;box-shadow:0 8px 14px #0009}
.platform:after{content:"";position:absolute;left:0;right:0;top:-11px;height:13px;background:repeating-linear-gradient(110deg,#315a36 0 5px,transparent 5px 15px)}
#plat0{left:-4%;bottom:15%;width:62%}#plat1{left:64%;bottom:23%;width:43%}#plat2{left:39%;bottom:37%;width:17%}#plat3{left:17%;bottom:49%;width:14%}
.crate{position:absolute;z-index:8;width:46px;height:41px;background:#67462e;border:5px solid #30231c;box-shadow:inset 0 0 0 2px #987047}

#player{position:absolute;z-index:12;width:96px;height:128px;overflow:hidden;
background-image:url('alter_true_sheet.png');background-size:2976px 128px;background-repeat:no-repeat;
background-position:0 0;image-rendering:pixelated;transform-origin:50% 100%;
filter:drop-shadow(0 7px 5px #000b)}
#player.faceL{transform:scaleX(-1)}
#player.damage{filter:brightness(1.7) saturate(.4) drop-shadow(0 7px 5px #000b)}
#shadow{position:absolute;z-index:9;width:50px;height:11px;border-radius:50%;background:#0007;filter:blur(2px)}
.projectile{position:absolute;z-index:16;width:19px;height:5px;background:#ffd078;box-shadow:0 0 10px #ffae41;border-radius:3px}
.muzzle{position:absolute;z-index:16;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff 0 15%,#ffc15a 25%,#ff7c30 42%,transparent 70%)}
.hitfx{position:absolute;z-index:17;width:58px;height:58px;border:4px solid #ffe2a0;border-radius:50%;opacity:.9}

#hud{position:absolute;z-index:30;left:2%;top:3%;padding:8px 12px;background:#05080eea;border:2px solid #725947;min-width:250px}
.title{font-size:19px;font-weight:bold;letter-spacing:2px}.red{color:#e65347}.cyan{color:#52d9df}
#obj{position:absolute;z-index:30;right:3%;top:3%;padding:9px 14px;background:#05080eea;border-left:3px solid #dc974e;min-width:280px}
#radioBox{position:absolute;z-index:31;right:3%;top:18%;width:355px;padding:11px;background:#03080ef0;border:1px solid #2794a3;display:none}
.wave{height:14px;margin-top:7px;background:repeating-linear-gradient(90deg,#43dbe2 0 2px,transparent 2px 7px)}
#joy{position:absolute;z-index:40;left:3%;bottom:4%;width:118px;height:118px;border:3px solid #8888;border-radius:50%;background:#070b11aa}
.stick{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#bbb9}
.btn{position:absolute;z-index:40;border-radius:50%;background:#070b11d8;border:3px solid #8888;color:white;font-weight:bold;display:grid;place-items:center;touch-action:none}
#jump{right:4%;bottom:19%;width:82px;height:82px}#radio{right:14%;bottom:20%;width:64px;height:64px}
#shoot{right:12%;bottom:5%;width:76px;height:76px}#hit{right:3%;bottom:4%;width:74px;height:74px}
#tag{position:absolute;z-index:30;left:2%;bottom:1.8%;font-size:11px;letter-spacing:1px;color:#ddd}#ver{color:#53d8df}
@media(orientation:portrait){#rotate{display:flex}#game{display:none}}
</style></head><body>
<div id="rotate">📻 RUOTA L’iPHONE<br><br><small>STAY ON THE AIR.</small></div>
<div id="game">
<div id="far" class="layer"></div><div id="mid" class="layer"></div><div class="haze"></div>
<div id="plat0" class="platform"></div><div id="plat1" class="platform"></div><div id="plat2" class="platform"></div><div id="plat3" class="platform"></div>
<div class="crate" style="left:45%;bottom:18%"></div><div class="crate" style="left:75%;bottom:26%"></div>
<div id="shadow"></div><div id="player"></div><div id="fore" class="layer"></div>
<div id="hud"><div class="title">ECO SOLITARIO</div>VITA <span class="red">♥♥♥♥♥</span> &nbsp; MUNIZIONI <span id="ammo">12/12</span></div>
<div id="obj"><span class="red">OBIETTIVO:</span><br>SEGUI LA FREQUENZA <span class="cyan">47.3 FM</span></div>
<div id="radioBox"><b class="cyan">47.3 FM — RADIO ECO</b><br><br><span id="line">Segnali deboli...</span><div class="wave"></div></div>
<div id="joy"><div class="stick" id="stick"></div></div>
<button id="radio" class="btn">📻</button><button id="jump" class="btn">SALTO</button><button id="shoot" class="btn">SPARO</button><button id="hit" class="btn">MAZZA</button>
<div id="tag">CITTÀ SENZA NOME &nbsp;|&nbsp; GIORNO ??? &nbsp;|&nbsp; STAY ON THE AIR &nbsp; <span id="ver">v0.9.2.1 SPRITE FIX</span></div>
</div>
<script>
const game=document.querySelector('#game'),P=document.querySelector('#player'),SH=document.querySelector('#shadow');
const F=document.querySelector('#far'),M=document.querySelector('#mid'),R=document.querySelector('#fore'),J=document.querySelector('#joy'),S=document.querySelector('#stick');
let px=180,py=0,vx=0,vy=0,face=1,onGround=false,state='idle',stateUntil=0,world=0,ammo=12,last=performance.now(),joyDir=0,jumpQueued=false;
const GRAV=1550,MOVE=245,JUMP=-650,W=96,H=128,CELL=96;
const anim={
 idle:{f:[0,1,2],fps:3}, walk:{f:[3,4,5,6],fps:8}, run:{f:[7,8,9,10,11],fps:11},
 jump:{f:[12,13],fps:7}, fall:{f:[14,15],fps:5}, land:{f:[16,17,18],fps:12},
 shoot:{f:[19,20,21,22,23],fps:16}, bat:{f:[24,25,26,27],fps:12}, damage:{f:[28,29,30],fps:10}
};
let af=0,acc=0;
function setFrame(c){c=Math.max(0,Math.min(30,Math.floor(c)));P.style.backgroundPositionX=(-CELL*c)+'px';P.style.backgroundPositionY='0px'}
function setState(s,ms=0){if(state!==s){state=s;af=0;acc=0}if(ms)stateUntil=performance.now()+ms}
function animate(dt,now){
 if(stateUntil&&now>stateUntil){stateUntil=0;setState(!onGround?(vy<0?'jump':'fall'):(Math.abs(vx)>10?'run':'idle'))}
 let a=anim[state]||anim.idle;acc+=dt;if(acc>=1/a.fps){acc=0;af=(af+1)%a.f.length}setFrame(a.f[af])
}
function plats(){let g=game.getBoundingClientRect();return[...document.querySelectorAll('.platform')].map(e=>{let r=e.getBoundingClientRect();return{x:r.left-g.left,y:r.top-g.top,w:r.width,h:r.height}})}
function collide(prevY){onGround=false;let fp=prevY+H,f=py+H;for(let p of plats()){let ox=px+W*.68>p.x&&px+W*.32<p.x+p.w;if(ox&&vy>=0&&fp<=p.y+8&&f>=p.y){py=p.y-H;vy=0;onGround=true;if(state==='fall'||state==='jump')setState('land',180);break}}let floor=game.clientHeight*.88;if(py+H>floor){py=floor-H;vy=0;onGround=true}}
function update(now){let dt=Math.min((now-last)/1000,.032);last=now;
 if(!stateUntil||!['shoot','bat','damage','land'].includes(state)){vx=joyDir*MOVE;if(joyDir)face=joyDir}else vx*=.8;
 if(jumpQueued&&onGround&&!stateUntil){vy=JUMP;onGround=false;setState('jump');jumpQueued=false}else jumpQueued=false;
 let prevY=py;px+=vx*dt;py+=vy*dt;vy+=GRAV*dt;
 let min=65,max=game.clientWidth*.50;if(px<min)px=min;if(px>max){world+=px-max;px=max}
 collide(prevY);
 if(!stateUntil){if(!onGround)setState(vy<20?'jump':'fall');else if(Math.abs(vx)>150)setState('run');else if(Math.abs(vx)>8)setState('walk');else setState('idle')}
 P.style.left=px+'px';P.style.top=py+'px';P.classList.toggle('faceL',face<0);
 SH.style.left=(px+W*.24)+'px';SH.style.top=(py+H-5)+'px';SH.style.opacity=onGround?'.7':'.2';
 /* FIX: move only background image, never the layer element itself */
 F.style.backgroundPositionX=(-world*.10)+'px';M.style.backgroundPositionX=(-world*.30)+'px';R.style.backgroundPositionX=(-world*.66)+'px';
 animate(dt,now);requestAnimationFrame(update)
}
function init(){px=game.clientWidth*.18;let g=game.getBoundingClientRect(),r=document.querySelector('#plat0').getBoundingClientRect();py=r.top-g.top-H;onGround=true;requestAnimationFrame(update)}
function move(e){let r=J.getBoundingClientRect(),t=e.touches[0],dx=Math.max(-38,Math.min(38,t.clientX-r.left-r.width/2));S.style.transform=`translateX(${dx}px)`;joyDir=Math.abs(dx)>9?Math.sign(dx):0}
J.addEventListener('touchstart',e=>{e.preventDefault();move(e)},{passive:false});J.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});J.addEventListener('touchend',()=>{joyDir=0;S.style.transform='translateX(0)'});
document.querySelector('#jump').addEventListener('touchstart',e=>{e.preventDefault();jumpQueued=true},{passive:false});
function muzzle(){let m=document.createElement('div');m.className='muzzle';m.style.left=(px+(face>0?W-5:-18))+'px';m.style.top=(py+55)+'px';game.appendChild(m);setTimeout(()=>m.remove(),80)}
function bullet(){let b=document.createElement('div');b.className='projectile';let bx=px+(face>0?W-4:-12),by=py+62,t0=performance.now(),lt=t0;b.style.left=bx+'px';b.style.top=by+'px';game.appendChild(b);function go(t){let dt=Math.min((t-lt)/1000,.03);lt=t;bx+=face*760*dt;b.style.left=bx+'px';if(t-t0<1200&&bx>-30&&bx<game.clientWidth+30)requestAnimationFrame(go);else b.remove()}requestAnimationFrame(go)}
document.querySelector('#shoot').addEventListener('touchstart',e=>{e.preventDefault();if(ammo<=0||stateUntil)return;ammo--;document.querySelector('#ammo').textContent=ammo+'/12';setState('shoot',360);muzzle();bullet()},{passive:false});
document.querySelector('#hit').addEventListener('touchstart',e=>{e.preventDefault();if(stateUntil)return;setState('bat',390);let fx=document.createElement('div');fx.className='hitfx';fx.style.left=(px+(face>0?W-4:-46))+'px';fx.style.top=(py+38)+'px';game.appendChild(fx);fx.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.3)',opacity:0}],{duration:280});setTimeout(()=>fx.remove(),290)},{passive:false});
let ro=false,li=0,lines=["Segnali deboli... ma sei ancora lì?","Finché ascolti, non sei solo.","Qualcuno trasmette ancora.","Alter... resta sulla frequenza."];
document.querySelector('#radio').addEventListener('touchstart',e=>{e.preventDefault();ro=!ro;document.querySelector('#radioBox').style.display=ro?'block':'none';if(ro)document.querySelector('#line').textContent=lines[li++%lines.length]},{passive:false});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');init();
</script></body></html>
