<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eco Solitario · Alter Motion V2</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0c0f15;color:#eef;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:linear-gradient(#151a24 0 76%,#10141b 76%)}
#floor{position:absolute;left:0;right:0;bottom:0;height:84px;background:#282e39;border-top:3px solid #737b89}
#player{position:absolute;width:96px;height:128px;left:0;top:0;image-rendering:pixelated;transform-origin:50% 100%;will-change:transform}
#shadow{position:absolute;width:48px;height:8px;border-radius:50%;background:#0008;filter:blur(2px)}
#hud{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:4;padding:9px 11px;border:1px solid #48505e;border-radius:8px;background:#080b10c9;font-size:11px;line-height:1.55}
#hud b{font-size:13px} #mode{color:#72e5db}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:126px;height:126px;border:2px solid #69717f;border-radius:50%;background:#080b10b8;z-index:5}
#stick{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#d3d7dfaa;will-change:transform}
#note{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font-size:10px;color:#8e96a5;text-align:right}
</style>
</head>
<body>
<div id="stage">
 <div id="hud"><b>ALTER MOTION V2</b><br><span id="mode">IDLE</span><br>movimento continuo · niente mondo</div>
 <div id="note">Eco Solitario<br>test camminata</div>
 <div id="shadow"></div>
 <canvas id="player" width="96" height="128"></canvas>
 <div id="floor"></div>
 <div id="joy"><div id="stick"></div></div>
</div>
<script>
const SHEET="alter_motion_v2_sheet.png";
const stage=document.querySelector("#stage"), canvas=document.querySelector("#player"), ctx=canvas.getContext("2d");
const joy=document.querySelector("#joy"), stick=document.querySelector("#stick"), shadow=document.querySelector("#shadow"), mode=document.querySelector("#mode");
ctx.imageSmoothingEnabled=false;
const img=new Image(); let ready=false; img.onload=()=>{ready=true; drawPose(0,0)}; img.src=SHEET;
const FW=96,FH=128;
let x=120,prevX=120,vx=0,face=1,axis=0,pointer=null,last=performance.now(),phase=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function approach(v,t,d){return v<t?Math.min(v+d,t):v>t?Math.max(v-d,t):t}
function groundY(){return stage.clientHeight-84-FH}
function drawFrame(index,alpha){
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,index*FW,0,FW,FH,0,0,FW,FH);
}
function drawPose(a,b,t=0){
  if(!ready)return;
  ctx.clearRect(0,0,FW,FH);
  // Cross-fade adjacent hand-drawn poses. Position/velocity are continuous,
  // so the body no longer "teleports" at a frame boundary.
  if(a===b){drawFrame(a,1);return}
  drawFrame(a,1-t); drawFrame(b,t);
  ctx.globalAlpha=1;
}
function gaitPose(){
  // compact sheet: 0 idle, 1..6 walk
  const n=6, p=(phase%1+1)%1*n, base=Math.floor(p), t=p-base;
  // smoothstep softens the transition between key poses
  const s=t*t*(3-2*t);
  return [1+base,1+((base+1)%n),s];
}
function tick(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  prevX=x;
  const target=axis*225;
  const reversing=axis&&vx&&Math.sign(axis)!==Math.sign(vx);
  vx=approach(vx,target,(axis?(reversing?1900:1250):1700)*dt);
  if(Math.abs(vx)<.2&&!axis)vx=0;
  if(Math.abs(vx)>8)face=Math.sign(vx);
  x+=vx*dt;
  x=clamp(x,22,Math.max(22,stage.clientWidth-FW-22));
  if(x===22||x===stage.clientWidth-FW-22)vx=0;
  const speed=Math.abs(vx);
  if(speed>3){
    phase=(phase+Math.abs(x-prevX)/116)%1;
    const [a,b,t]=gaitPose(); drawPose(a,b,t); mode.textContent="WALK · "+Math.round(speed);
  }else{
    phase=0; drawPose(0,0); mode.textContent="IDLE";
  }
  const y=groundY();
  canvas.style.transform=`translate3d(${x.toFixed(2)}px,${y}px,0) scaleX(${face})`;
  shadow.style.transform=`translate3d(${(x+24).toFixed(2)}px,${y+FH-4}px,0)`;
  requestAnimationFrame(tick);
}
function joyMove(e){
  const r=joy.getBoundingClientRect(), dx=clamp(e.clientX-(r.left+r.width/2),-43,43);
  stick.style.transform=`translate3d(${dx}px,0,0)`;
  const raw=dx/43, dead=.1;
  axis=Math.abs(raw)<=dead?0:Math.sign(raw)*(Math.abs(raw)-dead)/(1-dead);
}
joy.onpointerdown=e=>{e.preventDefault();pointer=e.pointerId;joy.setPointerCapture(pointer);joyMove(e)}
joy.onpointermove=e=>{if(e.pointerId===pointer){e.preventDefault();joyMove(e)}}
function release(e){if(e.pointerId===pointer){pointer=null;axis=0;stick.style.transform="translate3d(0,0,0)"}}
joy.onpointerup=release;joy.onpointercancel=release;joy.onlostpointercapture=release;
window.onblur=()=>{axis=0;stick.style.transform="translate3d(0,0,0)"};
requestAnimationFrame(tick);
</script>
</body></html>
