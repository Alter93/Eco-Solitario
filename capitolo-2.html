<head>

<title>Eco Solitario · Capitolo 2 · Città Morta</title>
<style>
:root{--panel:#070910d9;--line:#52606f;--txt:#eef5ff;--cyan:#62e7ef;--amber:#ffd16d;--red:#ff6b73;--green:#8cff9b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#090c14}

.label{width:52px;color:#9aa7b5}.bar{position:relative;flex:1;height:9px;border:1px solid #485363;background:#10141c;border-radius:4px;overflow:hidden}.fill{height:100%;width:100%;transition:width .08s linear}.hp{background:#cf4150}.st{background:#e3b447}

#radioTop{display:flex;gap:8px;align-items:center;margin-bottom:7px}.face{width:38px;height:38px;border:1px solid #647184;background:#121722;display:grid;place-items:center;font-weight:900;font-size:11px;border-radius:5px;position:relative;overflow:hidden}.face:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#d7a47e;top:5px;left:9px}.face:after{content:"";position:absolute;width:22px;height:12px;background:#313744;bottom:2px;left:7px;border-radius:5px 5px 0 0}.face span{z-index:2;position:absolute;bottom:0;font-size:8px;background:#000a;width:100%;text-align:center}.jack{box-shadow:inset 0 0 0 1px #51b8ff55}.dex{box-shadow:inset 0 0 0 1px #ffbf6355}
#signal{font-size:9px;color:#7f8d9b;line-height:1.3;flex:1}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#69f7b4;box-shadow:0 0 10px #69f7b4;margin-right:5px}

.btn{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid #66717f;background:#090c12db;color:#fff;font-weight:900;display:grid;place-items:center;box-shadow:0 8px 20px #0008;touch-action:none;font-size:11px}.btn:active{transform:scale(.94);background:#171d27}
#jump{right:max(18px,env(safe-area-inset-right));bottom:120px;width:82px;height:82px}#shoot{right:116px;bottom:max(20px,env(safe-area-inset-bottom));width:72px;height:72px}#melee{right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:72px;height:72px}#run{right:205px;bottom:max(26px,env(safe-area-inset-bottom));width:58px;height:58px;font-size:9px}
#overlay{position:fixed;z-index:50;inset:0;display:none;place-items:center;background:#02040adb;padding:24px}.card{max-width:520px;text-align:center;background:#090d16;border:1px solid #566475;border-radius:12px;padding:24px;box-shadow:0 20px 70px #000}.card h1{font-size:22px;margin:0 0 8px}.card p{font-size:12px;line-height:1.5;color:#c8d2dd}.card button{margin-top:12px;border:1px solid #718092;background:#111824;color:#fff;border-radius:8px;padding:10px 16px;font:inherit;font-weight:800}
#tip{position:fixed;z-index:18;left:50%;bottom:12px;transform:translateX(-50%);font-size:9px;color:#7c8998;background:#04060aaa;padding:5px 8px;border-radius:4px;pointer-events:none}
@media(max-width:760px){#hud{width:44vw}.panel{padding:8px}#radio{width:45vw}.face{width:32px;height:32px}.face:before{left:7px}.face:after{left:5px}#radioText{font-size:9px}.title{font-size:10px}#objective,#stats,.row{font-size:8px}.label{width:42px}#tip{display:none}}

</style>

<body>
<canvas id="game"></canvas>
<div id="hud" class="panel">
  <div class="title">ALTER · CAPITOLO 2</div>
  <div class="row"><span class="label">SALUTE</span><div class="bar"><div id="hp" class="fill hp"></div></div><span id="hpTxt">100</span></div>
  <div class="row"><span class="label">STAMINA</span><div class="bar"><div id="st" class="fill st"></div></div><span id="stTxt">100</span></div>
  <div id="stats"><span>🔫 <b id="ammo">18</b></span><span>☠ <b id="kills">0</b></span><span>📡 <b id="dist">0m</b></span></div>
  <div id="objective">OBIETTIVO: raggiungi il ripetitore radio oltre il settore 5.</div>
</div>
<div id="radio" class="panel">
  <div id="radioTop"><div class="face jack"><span>JACK</span></div><div class="face dex"><span>DEX</span></div><div id="signal"><span class="dot"></span>RADIO 88.7 FM<br>SEGNALE INSTABILE</div></div>
  <div id="radioText"><span id="speaker">JACK:</span> Alter, se ci senti, la città non è morta. Fa solo finta molto bene.</div>
</div>
<div id="controls"><div id="joy"><div id="stick"></div></div><button id="jump" class="btn">SALTO</button><button id="shoot" class="btn">SPARO</button><button id="melee" class="btn">MAZZA</button><button id="run" class="btn">CORSA</button></div>
<div id="tip">PC: A/D o ←/→ · Shift corsa · Spazio salto · J sparo · K mazza</div>
<div id="overlay"><div class="card"><h1 id="endTitle">FINE</h1><p id="endText"></p><button id="restart">RIPROVA</button></div></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const hpEl=document.getElementById('hp'),stEl=document.getElementById('st'),hpTxt=document.getElementById('hpTxt'),stTxt=document.getElementById('stTxt'),ammoEl=document.getElementById('ammo'),killsEl=document.getElementById('kills'),distEl=document.getElementById('dist'),objectiveEl=document.getElementById('objective'),radioText=document.getElementById('radioText'),speakerEl=document.getElementById('speaker'),overlay=document.getElementById('overlay'),endTitle=document.getElementById('endTitle'),endText=document.getElementById('endText');
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1),GROUND=H-116;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';GROUND=H-116;}
addEventListener('resize',resize,{passive:true});resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)); const lerp=(a,b,t)=>a+(b-a)*t; const sgn=v=>v<0?-1:1;
const WORLD=6200,GRAV=1800;
const keys=new Set(); let joyX=0,joyPointer=null,runHeld=false,last=performance.now(),acc=0,gameState='play',camera=0,shake=0,flash=0,radioCooldown=0;
let particles=[],bullets=[],enemyBullets=[],pickups=[],enemies=[];
const player={x:180,y:0,vx:0,vy:0,w:30,h:58,face:1,ground:true,hp:100,st:100,ammo:18,maxAmmo:18,kills:0,shootCd:0,meleeCd:0,inv:0,anim:0,step:0,dead:false};
const checkpoints=[850,1700,2600,3500,4450,5350];
const platforms=[
{x:0,w:1040,y:0},{x:1110,w:930,y:0},{x:2120,w:1030,y:0},{x:3230,w:840,y:0},{x:4140,w:1110,y:0},{x:5320,w:880,y:0},
{x:720,w:260,y:-115},{x:1450,w:230,y:-90},{x:2360,w:250,y:-140},{x:3020,w:210,y:-95},{x:3860,w:260,y:-125},{x:4750,w:290,y:-110}
];
const signs=[{x:560,t:'NOVA'},{x:1540,t:'VOID'},{x:2480,t:'88.7'},{x:3670,t:'SOMA'},{x:4620,t:'ECHO'}];
const radioLines=[
['JACK','Alter, regola uno: se qualcosa brilla nel buio, non leccarlo.'],['DEX','Regola due: Jack non scrive più le regole.'],['JACK','Vedo movimento sul vecchio viale. Non sei solo.'],['DEX','La buona notizia è che hanno poca mira. La cattiva è che ne hanno parecchia.'],['JACK','Il ripetitore è ancora acceso. Qualcuno lo sta alimentando.'],['DEX','O qualcosa. Mi piace lasciare aperta la porta al trauma.'],['JACK','Hai fatto fuori un bandito. Ora gli altri sapranno che sei qui.'],['DEX','Ottimo ingresso in città. Discreto, sobrio, quasi diplomatico.'],['JACK','La frequenza sta diventando pulita. Continua verso est.'],['DEX','Se trovi un distributore ancora pieno, priorità assoluta: patatine.']
];
let radioIndex=0;
function say(name,text){speakerEl.textContent=name+':'; radioText.childNodes.forEach(n=>{if(n!==speakerEl)n.remove();}); radioText.append(' '+text); radioCooldown=4.5;}
function nextRadio(force){if(radioCooldown>0&&!force)return; const r=radioLines[radioIndex++%radioLines.length];say(r[0],r[1]);}
function groundAt(x,feetY){let best=null; for(const p of platforms){if(x+player.w*.4>p.x&&x-player.w*.4<p.x+p.w){const py=GROUND+p.y;if(feetY<=py+18&&(best===null||py<best))best=py;}} return best;}
function spawnEnemies(){const data=[[690,'bat'],[980,'gun'],[1390,'gun'],[1780,'bat'],[2260,'gun'],[2510,'bat'],[2940,'gun'],[3380,'gun'],[3890,'bat'],[4260,'gun'],[4680,'gun'],[5010,'bat'],[5480,'gun'],[5750,'gun']]; enemies=data.map((d,i)=>({x:d[0],y:GROUND-56,vx:0,w:28,h:56,type:d[1],hp:d[1]==='gun'?55:70,face:i%2?1:-1,home:d[0],cd:Math.random(),alert:0,dead:false,anim:Math.random()*10,ground:true}));}
function spawnPickups(){pickups=[{x:1260,y:GROUND-24,type:'ammo',v:9},{x:2050,y:GROUND-24,type:'med',v:35},{x:3180,y:GROUND-24,type:'ammo',v:8},{x:4080,y:GROUND-24,type:'med',v:30},{x:5180,y:GROUND-24,type:'ammo',v:10}];}
function reset(){player.x=180;player.y=GROUND-player.h;player.vx=player.vy=0;player.face=1;player.ground=true;player.hp=100;player.st=100;player.ammo=18;player.kills=0;player.shootCd=player.meleeCd=player.inv=0;player.dead=false;camera=0;bullets=[];enemyBullets=[];particles=[];spawnEnemies();spawnPickups();radioIndex=0;radioCooldown=0;gameState='play';overlay.style.display='none';objectiveEl.textContent='OBIETTIVO: raggiungi il ripetitore radio oltre il settore 5.';say('JACK','Alter, se ci senti, la città non è morta. Fa solo finta molto bene.');}
spawnEnemies();spawnPickups();
function axis(){const k=(keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(keys.has('ArrowLeft')||keys.has('KeyA')?1:0);return k||joyX;}
function sprinting(){return (runHeld||keys.has('ShiftLeft')||keys.has('ShiftRight'))&&Math.abs(axis())>.25&&player.st>2;}
function jump(){if(gameState!=='play')return;if(player.ground&&player.st>=8){player.vy=-680;player.ground=false;player.st-=8;burst(player.x,player.y+player.h,5,'dust');}}
function shoot(){if(gameState!=='play'||player.shootCd>0)return;if(player.ammo<=0){say('DEX','Click. La pistola suggerisce una pausa di riflessione.');player.shootCd=.25;return;}player.ammo--;player.shootCd=.23;const bx=player.x+player.face*20,by=player.y+24;bullets.push({x:bx,y:by,vx:player.face*930,life:1.1});flash=.06;shake=Math.max(shake,2);burst(bx,by,4,'spark');}
function melee(){if(gameState!=='play'||player.meleeCd>0||player.st<14)return;player.meleeCd=.48;player.st-=14;shake=Math.max(shake,1.5);setTimeout(()=>{if(gameState!=='play')return;for(const e of enemies){if(e.dead)continue;const dx=e.x-player.x,dy=(e.y+e.h*.5)-(player.y+player.h*.5);if(Math.abs(dx)<74&&Math.abs(dy)<58&&Math.sign(dx||player.face)===player.face){hurtEnemy(e,42,player.face*250);}}},110);}
function hurtEnemy(e,dmg,kick){if(e.dead)return;e.hp-=dmg;e.vx+=kick;e.alert=3;burst(e.x,e.y+25,7,'blood');if(e.hp<=0){e.dead=true;player.kills++;burst(e.x,e.y+30,12,'spark');if(Math.random()<.38)pickups.push({x:e.x,y:e.y+20,type:Math.random()<.62?'ammo':'med',v:Math.random()<.62?6:22});if(player.kills===1)nextRadio(true);}}
function hurtPlayer(dmg,dir){if(player.inv>0||gameState!=='play')return;player.hp-=dmg;player.inv=.65;player.vx+=dir*210;player.vy=-190;shake=6;burst(player.x,player.y+28,10,'blood');if(player.hp<=25&&player.hp>0)say('JACK','Alter, sei messo male. Cerca qualcosa per curarti.');if(player.hp<=0){player.hp=0;gameState='dead';player.dead=true;endTitle.textContent='SEGNALE PERDUTO';endText.textContent='Alter è caduto nella Città Morta. Jack e Dexter restano in onda, aspettando un rumore sulla frequenza.';overlay.style.display='grid';}}
function burst(x,y,n,type){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.8)*220,life:.25+Math.random()*.55,type});}
function win(){if(gameState!=='play')return;gameState='win';say('DEX','Te l’avevo detto. C’era qualcuno dall’altra parte. Il problema è capire chi.');endTitle.textContent='FREQUENZA AGGANCIATA';endText.textContent='Alter ha raggiunto il ripetitore. La trasmissione continua. Capitolo 2 completato.';overlay.style.display='grid';objectiveEl.textContent='OBIETTIVO COMPLETATO · 88.7 FM ONLINE';}
function updatePlayer(dt){player.shootCd=Math.max(0,player.shootCd-dt);player.meleeCd=Math.max(0,player.meleeCd-dt);player.inv=Math.max(0,player.inv-dt);player.anim+=dt;const a=axis();const run=sprinting();const max=run?315:205;const target=a*max;const accel=player.ground?1500:740;player.vx+=(target-player.vx)*clamp(accel*dt/Math.max(max,1),0,1);if(Math.abs(a)<.05)player.vx*=Math.pow(.002,dt);if(Math.abs(player.vx)<.4)player.vx=0;if(Math.abs(a)>.08)player.face=sgn(a);if(run){player.st=Math.max(0,player.st-26*dt);}else player.st=Math.min(100,player.st+(player.ground?18:10)*dt);player.vy+=GRAV*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=clamp(player.x,16,WORLD-20);
const gy=groundAt(player.x,player.y+player.h);if(gy!==null&&player.vy>=0&&player.y+player.h>=gy&&player.y+player.h<=gy+26){if(!player.ground&&player.vy>180)burst(player.x,gy,7,'dust');player.y=gy-player.h;player.vy=0;player.ground=true;}else player.ground=false;
if(player.y>H+260)hurtPlayer(999,0);player.step+=Math.abs(player.vx)*dt;if(player.x>WORLD-220)win();}
function streetAt(x){return platforms.some(p=>p.y===0&&x>p.x+18&&x<p.x+p.w-18);}
function updateEnemies(dt){for(const e of enemies){if(e.dead)continue;e.anim+=dt;e.cd=Math.max(0,e.cd-dt);const dx=player.x-e.x,dist=Math.abs(dx);if(dist<520)e.alert=Math.max(e.alert,2.2);else e.alert=Math.max(0,e.alert-dt);let target=0;if(e.alert>0){e.face=sgn(dx);if(e.type==='gun'){if(dist>230)target=e.face*95;else if(dist<150)target=-e.face*80;if(dist<380&&e.cd<=0&&Math.abs((player.y+20)-(e.y+20))<95){enemyBullets.push({x:e.x+e.face*18,y:e.y+23,vx:e.face*560,vy:(Math.random()-.5)*35,life:1.3});e.cd=.85+Math.random()*.55;}}else{if(dist>48)target=e.face*125;else if(e.cd<=0){e.cd=.9;if(Math.abs(player.y-e.y)<70)hurtPlayer(14,e.face);}}}else{const edge=95; if(e.x<e.home-edge)e.face=1;if(e.x>e.home+edge)e.face=-1;target=e.face*45;}e.vx+=(target-e.vx)*clamp(dt*4.3,0,1);e.x+=e.vx*dt;}
}
function updateProjectiles(dt){for(const b of bullets){b.x+=b.vx*dt;b.life-=dt;for(const e of enemies){if(!e.dead&&b.life>0&&Math.abs(b.x-e.x)<22&&Math.abs(b.y-(e.y+24))<34){b.life=0;hurtEnemy(e,34,b.vx*.18);break;}}}bullets=bullets.filter(b=>b.life>0&&b.x>0&&b.x<WORLD);for(const b of enemyBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life>0&&Math.abs(b.x-player.x)<20&&Math.abs(b.y-(player.y+25))<30){b.life=0;hurtPlayer(12,sgn(b.vx));}}enemyBullets=enemyBullets.filter(b=>b.life>0);}
function updatePickups(){pickups=pickups.filter(p=>{if(Math.abs(p.x-player.x)<30&&Math.abs(p.y-(player.y+30))<45){if(p.type==='ammo'){player.ammo=Math.min(player.maxAmmo,player.ammo+p.v);say('DEX','Munizioni. Improvvisamente il mondo sembra un filo più educato.');}else{player.hp=Math.min(100,player.hp+p.v);say('JACK','Kit medico. Questa città ogni tanto si ricorda le buone maniere.');}burst(p.x,p.y,9,'heal');return false;}return true;});}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);}
function update(dt){if(gameState!=='play')return;radioCooldown=Math.max(0,radioCooldown-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-18*dt);updatePlayer(dt);updateEnemies(dt);updateProjectiles(dt);updatePickups();updateParticles(dt);camera=lerp(camera,clamp(player.x-W*.34,0,WORLD-W),1-Math.pow(.00015,dt));const sector=Math.min(6,1+Math.floor(player.x/950));distEl.textContent=Math.floor(player.x/10)+'m';objectiveEl.textContent=sector<6?'OBIETTIVO: attraversa il settore '+sector+' e raggiungi il ripetitore.':'OBIETTIVO: il ripetitore è vicino. Mantieni la frequenza.';if(radioCooldown<=0&&Math.random()<dt*.06)nextRadio();}
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function drawSky(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07101b');g.addColorStop(.58,'#18202a');g.addColorStop(1,'#2a2524');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const pulse=.5+.5*Math.sin(t*.08);ctx.globalAlpha=.08+.05*pulse;ctx.fillStyle='#6ce8ff';ctx.fillRect(0,H*.42,W,2);ctx.globalAlpha=1;for(let i=0;i<45;i++){const x=((i*173-camera*.05)% (W+120))-60,y=25+(i*67)%Math.max(80,H*.48);px(x,y,1,1,i%4?'#8fa2b3':'#d5f7ff');}}
function drawBuildings(layer,baseY,scale,shade){const offset=-(camera*layer)%160;for(let i=-2;i<Math.ceil(W/160)+3;i++){const worldi=i+Math.floor(camera*layer/160);const h=80+((worldi*53+layer*997)%190+190)%190;const x=offset+i*160;ctx.fillStyle=shade;ctx.fillRect(x,baseY-h*scale,118,h*scale);ctx.fillStyle='#0a0e15';for(let yy=baseY-h*scale+14;yy<baseY-12;yy+=20){for(let xx=x+12;xx<x+104;xx+=22){if(((xx+yy+worldi*13)|0)%4)ctx.fillRect(xx,yy,7,9);}}}}
function drawWorld(t){drawSky(t);drawBuildings(.12,GROUND+8,.8,'#111723');drawBuildings(.25,GROUND+12,1,'#161b24');for(const s of signs){const sx=s.x-camera*.55;if(sx>-120&&sx<W+120){px(sx,GROUND-235,94,30,'#10141b');ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillStyle=(Math.sin(t*4+s.x)>.1?'#54e7ff':'#326c75');ctx.fillText(s.t,sx+47,GROUND-215);}}ctx.save();ctx.translate(-camera,0);for(const p of platforms){const y=GROUND+p.y;px(p.x,y,p.w,18,'#4b5057');px(p.x,y+18,p.w,H-y,'#24282e');for(let x=p.x+20;x<p.x+p.w;x+=80)px(x,y+37,38,4,'#3b4046');}for(let x=360;x<WORLD;x+=620){px(x,GROUND-84,9,84,'#393f46');px(x-20,GROUND-87,50,5,'#505962');ctx.globalAlpha=.35;px(x+4,GROUND-145,2,56,'#62e7ef');ctx.globalAlpha=1;}drawTower();ctx.restore();}
function drawTower(){const x=WORLD-155,y=GROUND-265;px(x,y,10,265,'#606975');px(x+55,y,10,265,'#606975');for(let yy=y+25;yy<GROUND;yy+=38){px(x,yy,65,5,'#4b535e');ctx.strokeStyle='#434b54';ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+65,yy+38);ctx.moveTo(x+65,yy);ctx.lineTo(x,yy+38);ctx.stroke();}ctx.fillStyle='#72efff';ctx.beginPath();ctx.arc(x+32,y-18,9,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.15+.1*Math.sin(performance.now()*.01);ctx.beginPath();ctx.arc(x+32,y-18,36,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
function drawAlter(){const x=player.x-camera,y=player.y;const speed=Math.abs(player.vx),move=player.ground?clamp(speed/180,0,1):0,phase=player.anim*(sprinting()?13:9),leg=Math.sin(phase)*7*move,arm=-leg*.7;ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(player.face,1);if(player.inv>0&&Math.floor(player.inv*18)%2===0)ctx.globalAlpha=.45;px(-8,7,16,15,'#d3a17a');px(-10,5,20,7,'#27222a');px(6,6,6,7,'#27222a');px(-12,20,24,25,'#8f2636');px(-10,43,20,8,'#c8b88e');ctx.save();ctx.translate(-8,27);ctx.rotate(arm*.02);px(-5,0,7,22,'#8f2636');px(-5,18,7,9,'#d3a17a');ctx.restore();ctx.save();ctx.translate(8,27);ctx.rotate(-arm*.02);px(-2,0,7,22,'#8f2636');px(-2,18,7,9,'#d3a17a');ctx.restore();ctx.save();ctx.translate(-6,50);ctx.rotate(leg*.025);px(-5,0,8,19,'#b7aa86');px(-7,16,11,6,'#2f3640');ctx.restore();ctx.save();ctx.translate(6,50);ctx.rotate(-leg*.025);px(-3,0,8,19,'#b7aa86');px(-4,16,11,6,'#2f3640');ctx.restore();px(-16,22,5,25,'#38414b');ctx.fillStyle='#2c343d';ctx.fillRect(-19,24,4,19);if(player.meleeCd>0){ctx.save();ctx.translate(14,29);ctx.rotate(-1.1+player.meleeCd*4.2);px(0,-2,42,5,'#a9a083');ctx.restore();}else{px(11,29,16,5,'#2d3239');px(22,27,7,4,'#a5abb0');}if(flash>0){ctx.fillStyle='#fff1a1';ctx.fillRect(31,26,10,3);}ctx.restore();}
function drawBandit(e){const x=e.x-camera,y=e.y,move=Math.sin(e.anim*7)*4*(Math.abs(e.vx)>8?1:0);ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(e.face,1);px(-8,6,16,14,'#b78365');px(-10,4,20,6,'#1e2025');px(-12,20,24,26,e.type==='gun'?'#374252':'#504034');px(-9,45,7,17,'#5a5350');px(2,45,7,17,'#5a5350');ctx.save();ctx.translate(-8,28);ctx.rotate(move*.025);px(-4,0,6,20,'#374252');ctx.restore();ctx.save();ctx.translate(8,28);ctx.rotate(-move*.025);px(-2,0,6,20,'#374252');ctx.restore();if(e.type==='gun'){px(11,28,20,4,'#777f87');px(25,27,7,3,'#9ba0a5');}else{px(10,27,6,5,'#7d7159');px(14,25,30,5,'#867a60');}ctx.restore();if(e.alert>0){ctx.fillStyle=e.type==='gun'?'#ffcb66':'#ff7a70';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText('!',x,y-6);}}
function drawEntities(t){ctx.save();ctx.translate(0,0);for(const p of pickups){const x=p.x-camera,y=p.y+Math.sin(t*3+p.x)*3;px(x-8,y-8,16,16,p.type==='ammo'?'#d0b45c':'#62c982');ctx.fillStyle='#091018';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(p.type==='ammo'?'A':'+',x,y+4);}for(const e of enemies)if(!e.dead&&e.x-camera>-80&&e.x-camera<W+80)drawBandit(e);drawAlter();for(const b of bullets)px(b.x-camera,b.y,8,2,'#fff1a1');for(const b of enemyBullets)px(b.x-camera,b.y,7,2,'#ff8a70');for(const p of particles){const c=p.type==='blood'?'#9a2633':p.type==='heal'?'#7cff9b':p.type==='dust'?'#8a8072':'#ffd773';px(p.x-camera,p.y,3,3,c);}ctx.restore();}
function drawWeather(t){ctx.globalAlpha=.12;ctx.strokeStyle='#9cc4d6';ctx.lineWidth=1;for(let i=0;i<34;i++){const x=(i*83+t*100)% (W+80)-40,y=(i*47+t*170)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-7,y+15);ctx.stroke();}ctx.globalAlpha=1;}
function render(t){ctx.setTransform(DPR,0,0,DPR,0,0);const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(sx,sy);drawWorld(t);drawEntities(t);drawWeather(t);ctx.restore();hpEl.style.width=player.hp+'%';stEl.style.width=player.st+'%';hpTxt.textContent=Math.ceil(player.hp);stTxt.textContent=Math.ceil(player.st);ammoEl.textContent=player.ammo;killsEl.textContent=player.kills;}
function loop(now){const frame=Math.min(.05,(now-last)/1000);last=now;acc+=frame;const step=1/120;while(acc>=step){update(step);acc-=step;}render(now/1000);requestAnimationFrame(loop);}requestAnimationFrame(loop);
function setJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,dx=clamp(e.clientX-cx,-43,43);joyX=Math.abs(dx)<7?0:dx/43;stick.style.transform='translate3d('+dx+'px,0,0)';}
joy.addEventListener('pointerdown',e=>{if(joyPointer!==null)return;e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();setJoy(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(type=>joy.addEventListener(type,e=>{if(e.pointerId===joyPointer){joyPointer=null;joyX=0;stick.style.transform='translate3d(0,0,0)';}}));
function bind(id,fn,onUp){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});if(onUp){['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();fn(false)}));}}
bind('jump',()=>jump());bind('shoot',()=>shoot());bind('melee',()=>melee());bind('run',v=>runHeld=v,true);document.getElementById('restart').addEventListener('click',reset);
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyA','KeyD','KeyJ','KeyK','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();keys.add(e.code);if(!e.repeat){if(e.code==='Space')jump();if(e.code==='KeyJ')shoot();if(e.code==='KeyK')melee();}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();joyX=0;runHeld=false;});
reset();
</script>
</body>
